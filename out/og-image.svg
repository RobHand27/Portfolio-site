<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style type="text/css">
      /* CSS to simulate UI and text styles */
      :root {
        --text-base: #a9aeb7; /* base color from text, likely off-white/grey */
        --highlight-name: #b7e3ff; /* a clean, cool white/blue for the name */
        --bg-color: #0b0c0e; /* dark background */
        --card-color: #17181c; /* dark card */
        --glow-color: #1a2a3e; /* a soft blue glow */
      }
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: var(--bg-color);
        font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      }
      .card-layer {
        position: relative;
        width: 800px; /* matched to image aspect and content */
        height: 380px;
        background-color: var(--card-color);
        border-radius: 20px;
        box-shadow: 0 0 25px rgba(26, 42, 62, 0.4); /* subtle card glow */
        padding: 50px;
        color: var(--text-base);
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .main-greeting {
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 25px;
        letter-spacing: -1px;
      }
      .highlight-name {
        color: var(--highlight-name);
      }
      .title {
        font-size: 20px;
        font-weight: 500;
        color: var(--highlight-name); /* matching style from text to highlight names/titles */
        margin-bottom: 30px;
        letter-spacing: 0.5px;
      }
      .institution {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0b0c0e" />

  <g transform="translate(512, 512) scale(1) translate(-400, -190)">
    <foreignObject x="0" y="0" width="800" height="380">
      <div xmlns="http://www.w3.org/1999/xhtml" class="card-layer">
        <div class="main-greeting">Hi, I'm <span class="highlight-name">Rob Hand</span></div>
        <div class="title">Software Engineer</div>
        <div class="institution">CS @ UIUC</div>
      </div>
    </foreignObject>
  </g>
</svg>
